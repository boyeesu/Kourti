name: Bug report
description: Report a reproducible problem. Do not include confidential data.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Do not include credentials, client documents, personal data, or vulnerabilities. See SECURITY.md for security reports.'
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 'Version, OS, deployment method, and browser where relevant.'
