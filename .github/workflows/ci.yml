name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to the minimum token access needed by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
      # Dependencies are installed without lifecycle hooks. The build executes
      # only after source checkout, with a read-only token and no secrets.
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run lint
      - run: npm run build
      # SOC 2 CI gate: run the test suite so regressions block the build.
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
