name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to the minimum token access needed by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
      # Dependencies are installed without lifecycle hooks. The build executes
      # only after source checkout, with a read-only token and no secrets.
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: npm run lint
      - run: npm run build
      # SOC 2 CI gate: run the test suite so regressions block the build.
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
