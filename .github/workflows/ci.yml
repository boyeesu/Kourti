name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
        run: |
          codex exec "Review the code changes for:
          1. Potential security vulnerabilities
          2. Code quality issues
          3. Best practices violations
          4. TypeScript/React specific issues
          5. Performance concerns
          
          Focus on changed files and provide actionable feedback."

      - name: Run Codex Security Scan
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
        run: |
          codex exec "Perform a security audit focusing on:
          1. SQL injection vulnerabilities
          2. XSS vulnerabilities
          3. Authentication/authorization issues
          4. Sensitive data exposure
          5. API security best practices
          
          Check Supabase functions and API endpoints."