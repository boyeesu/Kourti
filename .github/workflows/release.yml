name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v1.0.0)
        required: true
        type: string

# This workflow is intentionally release-only: deployments require an explicit
# hosting target, environment protection rules, and separately configured secrets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Validate frontend
        run: |
          npm ci --ignore-scripts
          npm run prepare
          npm run lint
          npm test
          npm run build
      - name: Validate backend
        working-directory: backend-node
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Package source release
        run: git archive --format=tar.gz --output=kourti-legal-${{ github.event.inputs.tag || github.ref_name }}.tar.gz HEAD
      - name: Generate checksums
        run: sha256sum kourti-legal-*.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" kourti-legal-*.tar.gz SHA256SUMS.txt --generate-notes --verify-tag
